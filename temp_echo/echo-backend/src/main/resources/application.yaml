ktor:
  application:
    modules:
      - echo.ApplicationKt.module
  deployment:
    port: 8080
jwt:
  issuer: "echo-backend"
  audience: "echo-users"
  realm: "ECHO API"
  secret: "echo-local-jwt-secret"
  expiresInMs: 86400000
db:
  mongo:
    host: "127.0.0.1"
    port: "27017"
    maxPoolSize: 20
    database:
      name: "echo"
gemini:
  model: "gemini-2.5-flash"
  apiKeyEnv: "GEMINI_API_KEY"
seed:
  leader:
    name: "Demo Leader"
    email: "leader@echo.local"
    password: "leader123"
